<div class="space-y-4">
    <div>
        <label for="rfid_uid" class="block text-sm font-semibold text-slate-700 mb-1">
            RFID UID <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="rfid_uid" name="rfid_uid" value="{{.Form.RfidUID}}" placeholder="Contoh: 53 7A 9C 21 atau D392A1F0"
            class="w-full px-4 py-2.5 rounded-xl border {{if index .Errors "rfid_uid"}}border-rose-400 focus:ring-rose-200{{else}}border-slate-200 focus:ring-blue-100{{end}} focus:border-blue-600 focus:ring-4 outline-none font-mono text-sm uppercase transition"
            required>
        {{with index .Errors "rfid_uid"}}
            <p class="text-xs text-rose-500 mt-1 font-medium">{{.}}</p>
        {{end}}
        <p class="text-xs text-slate-400 mt-1">UID tag RFID fisik yang ditempel pada kemasan barang.</p>
    </div>

    <div>
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">
            Nama Barang <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="name" name="name" value="{{.Form.Name}}" placeholder="Contoh: Biskuit Cokelat 250g"
            class="w-full px-4 py-2.5 rounded-xl border {{if index .Errors "name"}}border-rose-400 focus:ring-rose-200{{else}}border-slate-200 focus:ring-blue-100{{end}} focus:border-blue-600 focus:ring-4 outline-none text-sm transition"
            required>
        {{with index .Errors "name"}}
            <p class="text-xs text-rose-500 mt-1 font-medium">{{.}}</p>
        {{end}}
    </div>

    <div>
        <label for="description" class="block text-sm font-semibold text-slate-700 mb-1">
            Deskripsi / Keterangan (Opsional)
        </label>
        <textarea id="description" name="description" rows="3" placeholder="Informasi tambahan mengenai produk..."
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none text-sm transition">{{.Form.Description}}</textarea>
        {{with index .Errors "description"}}
            <p class="text-xs text-rose-500 mt-1 font-medium">{{.}}</p>
        {{end}}
    </div>
</div>
