<!-- Modal konfirmasi hapus data (Tailwind) -->
<div id="deleteModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 transform transition-all">
        <form method="POST" id="deleteForm">
            <input type="hidden" name="_csrf" value="{{.CsrfToken}}">
            <input type="hidden" name="_method" value="DELETE">
            
            <div class="flex items-center gap-3 mb-4 text-rose-600">
                <span class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center font-bold text-lg">!</span>
                <h3 class="text-lg font-bold text-slate-800">Konfirmasi Hapus</h3>
            </div>
            
            <p class="text-sm text-slate-600 mb-6">
                Yakin ingin menghapus <strong id="deleteName" class="text-slate-900"></strong>? Data yang dihapus tidak bisa dikembalikan.
            </p>
            
            <div class="flex justify-end gap-3">
                <button type="button" id="btnCancelDelete" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                    Batal
                </button>
                <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition">
                    Ya, Hapus
                </button>
            </div>
        </form>
    </div>
</div>
